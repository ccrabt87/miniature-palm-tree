<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
  <style>
    body { margin: 0; font-family: 'Cormorant Garamond', 'Georgia', serif; }
    a { color: #c9a84c; } a:hover { color: #e8d48b; }
  </style>
</helmet>

<div style="width: 1600px; height: 1200px; background: #0d0a1a; position: relative; overflow: hidden;">

  <!-- Background -->
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 50%, rgba(83, 52, 131, 0.25) 0%, transparent 60%);"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 70% 50%, rgba(83, 52, 131, 0.15) 0%, transparent 60%);"></div>

  <!-- Stars -->
  <svg style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.25;" viewBox="0 0 1600 1200">
    <circle cx="150" cy="90" r="1" fill="#e8d48b"/>
    <circle cx="500" cy="50" r="0.8" fill="#fff"/>
    <circle cx="1100" cy="70" r="1.2" fill="#e8d48b"/>
    <circle cx="1450" cy="110" r="0.7" fill="#fff"/>
    <circle cx="250" cy="1100" r="0.9" fill="#e8d48b"/>
    <circle cx="1350" cy="1080" r="1" fill="#fff"/>
  </svg>

  <!-- Border -->
  <div style="position: absolute; inset: 40px; border: 1px solid rgba(201, 168, 76, 0.2); pointer-events: none;"></div>

  <!-- Content -->
  <div style="position: relative; z-index: 1; padding: 80px 100px; height: 100%; display: flex; flex-direction: column;">

    <!-- Header -->
    <div style="text-align: center; margin-bottom: 48px;">
      <h2 style="font-family: 'Cinzel', 'Georgia', serif; font-size: 42px; font-weight: 700; color: #faf5e6; margin: 0 0 8px 0; letter-spacing: 4px;">Meet the Archetypes</h2>
      <svg style="width: 200px; height: 16px;" viewBox="0 0 200 16">
        <line x1="0" y1="8" x2="80" y2="8" stroke="#c9a84c" stroke-width="0.5" opacity="0.5"/>
        <line x1="120" y1="8" x2="200" y2="8" stroke="#c9a84c" stroke-width="0.5" opacity="0.5"/>
        <rect x="93" y="1" width="7" height="7" transform="rotate(45 96.5 4.5)" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>
      </svg>
    </div>

    <!-- Cards showcase -->
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 28px; flex: 1; align-content: center;">

      <!-- Card: The Ghoster -->
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div style="width: 100%; aspect-ratio: 2.5/4; background: linear-gradient(160deg, #1a1440, #2d1f5e, #1a1440); border: 1px solid rgba(201, 168, 76, 0.4); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 0 30px rgba(83, 52, 131, 0.2);">
          <div style="width: calc(100% - 8px); height: calc(100% - 8px); border: 1px solid rgba(201, 168, 76, 0.2); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;">
            <svg style="width: 56px; height: 56px; margin-bottom: 12px;" viewBox="0 0 56 56">
              <circle cx="28" cy="28" r="20" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.5" stroke-dasharray="4 3"/>
              <circle cx="28" cy="28" r="12" fill="none" stroke="#c9a84c" stroke-width="0.6" opacity="0.3" stroke-dasharray="2 4"/>
              <circle cx="28" cy="28" r="3" fill="#c9a84c" opacity="0.15"/>
            </svg>
            <span style="font-family: 'Cinzel', 'Georgia', serif; font-size: 11px; font-weight: 600; color: #c9a84c; letter-spacing: 1.5px; text-align: center;">I</span>
          </div>
        </div>
        <span style="font-family: 'Cinzel', 'Georgia', serif; font-size: 13px; font-weight: 600; color: #faf5e6; margin-top: 12px; letter-spacing: 1px; text-align: center;">The Ghoster</span>
        <span style="font-size: 13px; font-style: italic; color: #a89cc8; margin-top: 2px;">vanishing act</span>
      </div>

      <!-- Card: The Love Bomber -->
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div style="width: 100%; aspect-ratio: 2.5/4; background: linear-gradient(160deg, #1a1440, #2d1f5e, #1a1440); border: 1px solid rgba(201, 168, 76, 0.4); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 0 30px rgba(83, 52, 131, 0.2);">
          <div style="width: calc(100% - 8px); height: calc(100% - 8px); border: 1px solid rgba(201, 168, 76, 0.2); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;">
            <svg style="width: 56px; height: 56px; margin-bottom: 12px;" viewBox="0 0 56 56">
              <path d="M28 44 C28 44 8 30 8 20 C8 12 14 8 20 8 C24 8 27 11 28 14 C29 11 32 8 36 8 C42 8 48 12 48 20 C48 30 28 44 28 44Z" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.6"/>
              <path d="M28 38 C28 38 16 28 16 22 C16 17 19 15 23 15 C25 15 27 17 28 19 C29 17 31 15 33 15 C37 15 40 17 40 22 C40 28 28 38 28 38Z" fill="#c9a84c" opacity="0.15"/>
            </svg>
            <span style="font-family: 'Cinzel', 'Georgia', serif; font-size: 11px; font-weight: 600; color: #c9a84c; letter-spacing: 1.5px;">II</span>
          </div>
        </div>
        <span style="font-family: 'Cinzel', 'Georgia', serif; font-size: 13px; font-weight: 600; color: #faf5e6; margin-top: 12px; letter-spacing: 1px; text-align: center;">The Love Bomber</span>
        <span style="font-size: 13px; font-style: italic; color: #a89cc8; margin-top: 2px;">overwhelming devotion</span>
      </div>

      <!-- Card: Situationship Surfer -->
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div style="width: 100%; aspect-ratio: 2.5/4; background: linear-gradient(160deg, #1a1440, #2d1f5e, #1a1440); border: 1px solid rgba(201, 168, 76, 0.4); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 0 30px rgba(83, 52, 131, 0.2);">
          <div style="width: calc(100% - 8px); height: calc(100% - 8px); border: 1px solid rgba(201, 168, 76, 0.2); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;">
            <svg style="width: 56px; height: 56px; margin-bottom: 12px;" viewBox="0 0 56 56">
              <path d="M8 32 Q18 20 28 32 Q38 44 48 32" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.6"/>
              <path d="M8 24 Q18 12 28 24 Q38 36 48 24" fill="none" stroke="#c9a84c" stroke-width="0.6" opacity="0.3"/>
              <circle cx="28" cy="28" r="4" fill="#c9a84c" opacity="0.2"/>
            </svg>
            <span style="font-family: 'Cinzel', 'Georgia', serif; font-size: 11px; font-weight: 600; color: #c9a84c; letter-spacing: 1.5px;">III</span>
          </div>
        </div>
        <span style="font-family: 'Cinzel', 'Georgia', serif; font-size: 12px; font-weight: 600; color: #faf5e6; margin-top: 12px; letter-spacing: 1px; text-align: center;">The Situationship Surfer</span>
        <span style="font-size: 13px; font-style: italic; color: #a89cc8; margin-top: 2px;">riding the undefined</span>
      </div>

      <!-- Card: The Avoidant Architect -->
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div style="width: 100%; aspect-ratio: 2.5/4; background: linear-gradient(160deg, #1a1440, #2d1f5e, #1a1440); border: 1px solid rgba(201, 168, 76, 0.4); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 0 30px rgba(83, 52, 131, 0.2);">
          <div style="width: calc(100% - 8px); height: calc(100% - 8px); border: 1px solid rgba(201, 168, 76, 0.2); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;">
            <svg style="width: 56px; height: 56px; margin-bottom: 12px;" viewBox="0 0 56 56">
              <rect x="12" y="20" width="32" height="28" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.5"/>
              <path d="M12 20 L28 8 L44 20" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.6"/>
              <rect x="22" y="32" width="12" height="16" fill="none" stroke="#c9a84c" stroke-width="0.6" opacity="0.3"/>
              <line x1="28" y1="32" x2="28" y2="48" stroke="#c9a84c" stroke-width="0.4" opacity="0.2"/>
            </svg>
            <span style="font-family: 'Cinzel', 'Georgia', serif; font-size: 11px; font-weight: 600; color: #c9a84c; letter-spacing: 1.5px;">IV</span>
          </div>
        </div>
        <span style="font-family: 'Cinzel', 'Georgia', serif; font-size: 12px; font-weight: 600; color: #faf5e6; margin-top: 12px; letter-spacing: 1px; text-align: center;">The Avoidant Architect</span>
        <span style="font-size: 13px; font-style: italic; color: #a89cc8; margin-top: 2px;">walls by design</span>
      </div>

      <!-- Card: The U-Haul Lesbian -->
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div style="width: 100%; aspect-ratio: 2.5/4; background: linear-gradient(160deg, #1a1440, #2d1f5e, #1a1440); border: 1px solid rgba(201, 168, 76, 0.4); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 0 30px rgba(83, 52, 131, 0.2);">
          <div style="width: calc(100% - 8px); height: calc(100% - 8px); border: 1px solid rgba(201, 168, 76, 0.2); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;">
            <svg style="width: 56px; height: 56px; margin-bottom: 12px;" viewBox="0 0 56 56">
              <path d="M28 8 L28 40" stroke="#c9a84c" stroke-width="1" opacity="0.6"/>
              <path d="M18 18 L28 8 L38 18" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.6"/>
              <circle cx="20" cy="38" r="8" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.4"/>
              <circle cx="36" cy="38" r="8" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.4"/>
            </svg>
            <span style="font-family: 'Cinzel', 'Georgia', serif; font-size: 11px; font-weight: 600; color: #c9a84c; letter-spacing: 1.5px;">V</span>
          </div>
        </div>
        <span style="font-family: 'Cinzel', 'Georgia', serif; font-size: 12px; font-weight: 600; color: #faf5e6; margin-top: 12px; letter-spacing: 1px; text-align: center;">The U-Haul Lesbian</span>
        <span style="font-size: 13px; font-style: italic; color: #a89cc8; margin-top: 2px;">instant nesting</span>
      </div>

      <!-- Card: Let's See Where This Goes -->
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div style="width: 100%; aspect-ratio: 2.5/4; background: linear-gradient(160deg, #1a1440, #2d1f5e, #1a1440); border: 1px solid rgba(201, 168, 76, 0.4); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 0 30px rgba(83, 52, 131, 0.2);">
          <div style="width: calc(100% - 8px); height: calc(100% - 8px); border: 1px solid rgba(201, 168, 76, 0.2); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;">
            <svg style="width: 56px; height: 56px; margin-bottom: 12px;" viewBox="0 0 56 56">
              <circle cx="28" cy="22" r="14" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.5"/>
              <circle cx="28" cy="22" r="4" fill="#c9a84c" opacity="0.2"/>
              <path d="M28 36 L28 48" stroke="#c9a84c" stroke-width="1" opacity="0.6"/>
              <circle cx="28" cy="48" r="2" fill="#c9a84c" opacity="0.3"/>
            </svg>
            <span style="font-family: 'Cinzel', 'Georgia', serif; font-size: 11px; font-weight: 600; color: #c9a84c; letter-spacing: 1.5px;">VI</span>
          </div>
        </div>
        <span style="font-family: 'Cinzel', 'Georgia', serif; font-size: 11px; font-weight: 600; color: #faf5e6; margin-top: 12px; letter-spacing: 1px; text-align: center;">The "Let's See" Coward</span>
        <span style="font-size: 13px; font-style: italic; color: #a89cc8; margin-top: 2px;">fear of labels</span>
      </div>

    </div>

    <!-- Bottom -->
    <div style="text-align: center; margin-top: 36px; padding-top: 28px; border-top: 1px solid rgba(201, 168, 76, 0.15);">
      <p style="font-family: 'Cinzel', 'Georgia', serif; font-size: 16px; color: rgba(201, 168, 76, 0.6); letter-spacing: 4px; margin: 0; text-transform: uppercase;">+ 16 More Archetypes Inside</p>
    </div>

  </div>
</div>

</x-dc>
</body>
</html>
